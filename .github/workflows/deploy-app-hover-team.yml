name: Deploy app.hover.team

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-app-hover-team
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AWS_REGION: ap-southeast-1
      INSTANCE_NAME: hover-production
      INSTANCE_IP: 46.137.250.101
      DEPLOY_BRANCH: hover-production
      DEPLOY_COMMIT: ${{ github.sha }}
      DEPLOY_ROLE_ARN: arn:aws:iam::991265479958:role/hover-production-github-actions-deploy
    steps:
      - name: Check out the exact deployment commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: hover-production-deploy

      - name: Package the source commit
        run: git bundle create hover-deploy.bundle "$DEPLOY_COMMIT"

      - name: Temporarily open SSH and obtain an ephemeral certificate
        run: |
          set -euo pipefail
          aws lightsail open-instance-public-ports \
            --instance-name "$INSTANCE_NAME" \
            --port-info fromPort=22,toPort=22,protocol=tcp,cidrs=0.0.0.0/0
          aws lightsail get-instance-access-details \
            --instance-name "$INSTANCE_NAME" \
            --protocol ssh > lightsail-access.json
          jq -r '.accessDetails.privateKey' lightsail-access.json > lightsail-ssh-key
          jq -r '.accessDetails.certKey' lightsail-access.json > lightsail-ssh-cert.pub
          chmod 600 lightsail-ssh-key

      - name: Install the source commit with Zulip's production upgrader
        run: |
          set -euo pipefail
          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o StrictHostKeyChecking=accept-new
            -i lightsail-ssh-key
            -o CertificateFile=lightsail-ssh-cert.pub
          )
          scp "${ssh_options[@]}" hover-deploy.bundle "ubuntu@$INSTANCE_IP:/tmp/hover-deploy-$DEPLOY_COMMIT.bundle"
          ssh "${ssh_options[@]}" "ubuntu@$INSTANCE_IP" \
            "sudo install -d -o zulip -g zulip /srv/zulip.git && \
             if ! sudo -u zulip git -C /srv/zulip.git rev-parse --is-bare-repository >/dev/null 2>&1; then \
               sudo -u zulip git init --bare /srv/zulip.git; \
             fi && \
             sudo -u zulip git -C /srv/zulip.git fetch /tmp/hover-deploy-$DEPLOY_COMMIT.bundle $DEPLOY_COMMIT:refs/heads/$DEPLOY_BRANCH && \
             sudo /home/zulip/deployments/current/scripts/upgrade-zulip-from-git --local-ref $DEPLOY_BRANCH && \
             sudo rm -f /tmp/hover-deploy-$DEPLOY_COMMIT.bundle && \
             sudo -u zulip /home/zulip/deployments/current/manage.py check"

      - name: Verify the public application
        run: curl --fail --show-error --silent --location https://app.hover.team/login/ --output /dev/null

      - name: Close temporary SSH access
        if: always()
        run: |
          aws lightsail close-instance-public-ports \
            --instance-name "$INSTANCE_NAME" \
            --port-info fromPort=22,toPort=22,protocol=tcp
