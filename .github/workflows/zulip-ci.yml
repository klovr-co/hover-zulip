# Defer the full validation suite until changes reach main or it is manually
# requested, keeping pull-request iteration free of long-running CI.

name: Zulip CI

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  HOME: /home/github/

jobs:
  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    container: zulip/ci:noble

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create cache directories
        run: |
          sudo mkdir -p /srv/zulip-emoji-cache
          sudo chown -R github /srv/zulip-emoji-cache

      - name: Restore dependency caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # zizmor: ignore[cache-poisoning]
        with:
          path: |
            /__w/.pnpm-store
            ~/.cache/uv
            /srv/zulip-emoji-cache
          key: dev-noble-${{ hashFiles('pnpm-lock.yaml', 'uv.lock', 'tools/setup/emoji/emoji_map.json', 'tools/setup/emoji/build_emoji', 'tools/setup/emoji/emoji_setup_utils.py', 'tools/setup/emoji/emoji_names.py') }}
          restore-keys: dev-noble-

      - name: Install dependencies
        run: ./tools/ci/setup-backend --skip-dev-db-build

      - name: Run fast repository checks
        run: |
          source tools/ci/activate-venv
          ./tools/test-tools
          ./tools/run-codespell
          ./tools/check-schemas
          ./manage.py makemessages --locale en
          ./tools/check-capitalization --no-generate
          ./tools/check-frontend-i18n --no-generate
          pnpm run --filter=starlight_help check

      - name: Run frontend lint
        run: |
          source tools/ci/activate-venv
          ./tools/lint --groups=frontend --skip=gitlint

      - name: Run backend lint
        run: |
          source tools/ci/activate-venv
          ./tools/lint --groups=backend --skip=gitlint,mypy

      - name: Run mypy
        run: |
          source tools/ci/activate-venv
          ./tools/run-mypy --version
          ./tools/run-mypy

      - name: Run miscellaneous consistency checks
        run: |
          source tools/ci/activate-venv
          env -u PYTHONDEVMODE -u PYTHONWARNINGS uv lock --check
          ./tools/test-migrations
          ./tools/setup/optimize-svg --check
          ./tools/setup/generate_integration_bots_avatars.py --check-missing
          ./tools/ci/check-executables
          chmod 000 static/generated web/generated
          ./scripts/lib/check-database-compatibility
          chmod 755 static/generated web/generated

      - name: Run frontend tests
        env:
          COLLECT_COVERAGE: ${{ github.event_name != 'pull_request' }}
        run: |
          source tools/ci/activate-venv
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
              coverage_args+=(--coverage)
          fi
          ./tools/test-js-with-node "${coverage_args[@]}" --parallel=1

      - name: Upload frontend coverage
        if: ${{ github.event_name != 'pull_request' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: var/node-coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run backend tests
        env:
          COLLECT_COVERAGE: ${{ github.event_name != 'pull_request' }}
        run: |
          source tools/ci/activate-venv
          coverage_args=()
          if [[ "$COLLECT_COVERAGE" == true ]]; then
              coverage_args+=(--coverage --no-cov-cleanup)
          fi
          ./tools/test-backend "${coverage_args[@]}" --xml-report --no-html-report --include-webhooks --include-transaction-tests --ban-console-output

      - name: Check for untracked files
        run: |
          untracked="$(git ls-files --exclude-standard --others)"
          if [[ -n "$untracked" ]]; then
              printf >&2 "Error: untracked files:\n%s\n" "$untracked"
              exit 1
          fi

      - name: Upload backend coverage
        if: ${{ github.event_name != 'pull_request' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: var/coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  deep-checks:
    name: Documentation and development database
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    container: zulip/ci:noble

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create cache directories
        run: |
          sudo mkdir -p /srv/zulip-emoji-cache
          sudo chown -R github /srv/zulip-emoji-cache

      - name: Restore dependency caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # zizmor: ignore[cache-poisoning]
        with:
          path: |
            /__w/.pnpm-store
            ~/.cache/uv
            /srv/zulip-emoji-cache
          key: dev-noble-${{ hashFiles('pnpm-lock.yaml', 'uv.lock', 'tools/setup/emoji/emoji_map.json', 'tools/setup/emoji/build_emoji', 'tools/setup/emoji/emoji_setup_utils.py', 'tools/setup/emoji/emoji_names.py') }}
          restore-keys: dev-noble-

      - name: Install dependencies
        run: ./tools/ci/setup-backend --skip-dev-db-build

      - name: Run documentation and API tests
        run: |
          source tools/ci/activate-venv
          ./tools/build-help-center
          ./tools/test-documentation --skip-external-links
          ./tools/test-help-documentation --skip-external-links --help-center
          ./tools/test-api

      - name: Check development database build
        run: ./tools/ci/setup-backend

  required-jobs:
    name: Required jobs
    if: always()
    needs:
      - tests
      - deep-checks
    runs-on: ubuntu-slim
    steps:
      - name: Check required jobs
        run: jq 'with_entries(.value |= .result | select(.value | IN("success", "skipped") | not)) | if . != {} then halt_error end' <<<"$NEEDS"
        env:
          NEEDS: ${{ toJSON(needs) }}
