<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Settings Dropdown</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'sans-serif'],
            display: ['"Manrope"', 'sans-serif'],
          },
          colors: {
            "surface-dim": "#d2d9f4",
            "surface-variant": "#dae2fd",
            "on-secondary-container": "#54647a",
            "primary-fixed-dim": "#b4c5ff",
            "on-primary-container": "#eeefff",
            "on-background": "#131b2e",
            "error": "#ba1a1a",
            "on-secondary-fixed": "#0b1c30",
            "secondary": "#505f76",
            "surface-tint": "#0053db",
            "on-secondary-fixed-variant": "#38485d",
            "surface-bright": "#faf8ff",
            "on-surface-variant": "#434655",
            "surface-container-lowest": "#ffffff",
            "primary-container": "#2563eb",
            "tertiary": "#525657",
            "primary-fixed": "#dbe1ff",
            "tertiary-fixed": "#e0e3e5",
            "on-tertiary": "#ffffff",
            "error-container": "#ffdad6",
            "surface-container-low": "#f2f3ff",
            "on-tertiary-container": "#eff1f3",
            "on-error-container": "#93000a",
            "tertiary-fixed-dim": "#c4c7c9",
            "inverse-on-surface": "#eef0ff",
            "on-error": "#ffffff",
            "outline-variant": "#c3c6d7",
            "on-surface": "#131b2e",
            "on-primary": "#ffffff",
            "on-secondary": "#ffffff",
            "background": "#faf8ff",
            "inverse-primary": "#b4c5ff",
            "secondary-container": "#d0e1fb",
            "on-primary-fixed-variant": "#003ea8",
            "surface": "#faf8ff",
            "primary": "#004ac6",
            "on-tertiary-fixed": "#191c1e",
            "surface-container-highest": "#dae2fd",
            "secondary-fixed": "#d3e4fe",
            "inverse-surface": "#283044",
            "surface-container-high": "#e2e7ff",
            "outline": "#737686",
            "on-primary-fixed": "#00174b",
            "tertiary-container": "#6b6e70",
            "secondary-fixed-dim": "#b7c8e1",
            "on-tertiary-fixed-variant": "#444749",
            "surface-container": "#eaedff"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          }
        }
      }
    }
  </script>
<style data-purpose="custom-utilities">
    body {
      background-color: theme('colors.surface-container');
      color: theme('colors.on-surface');
    }
    .shadow-dropdown {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 300,
      'GRAD' 0,
      'opsz' 24
    }
  </style>
</head>
<body class="p-8 flex justify-center items-start min-h-screen font-sans">
<!-- BEGIN: Dropdown Container -->
<div class="relative w-72 bg-surface-container-lowest rounded-xl shadow-dropdown border border-outline-variant overflow-hidden" data-purpose="settings-dropdown">
<!-- Top Pointer Arrow (Simulated) - Adjusted for new position -->
<div class="absolute top-8 -left-2 w-4 h-4 bg-surface-container-lowest border-b border-l border-outline-variant transform rotate-45" style="clip-path: polygon(0 0, 0 100%, 100% 100%);"></div>
<!-- BEGIN: Header Info -->
<div class="p-4 pb-3 border-b border-surface-container-high" data-purpose="dropdown-header">
<div class="flex items-center">
<span class="material-symbols-outlined text-green-500 mr-2 font-bold" style="font-variation-settings: 'wght' 600;">tag</span>
<h2 class="text-[24px] leading-[1.3] font-semibold text-on-surface font-display tracking-tight">devel</h2>
</div>
</div>
<!-- END: Header Info -->
<!-- BEGIN: Settings Links - Group 1 -->
<div class="py-1 border-b border-surface-container-high" data-purpose="settings-links-1">
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface" href="#">
<span class="material-symbols-outlined text-primary w-6 h-6 mr-3 flex items-center justify-center">mark_chat_read</span>
<span class="text-[16px] leading-[1.5] text-on-surface">Mark all messages as unread</span>
</a>
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface" href="#">
<span class="material-symbols-outlined text-primary w-6 h-6 mr-3 flex items-center justify-center">view_timeline</span>
<span class="text-[16px] leading-[1.5] text-on-surface">Go to channel feed</span>
</a>
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface justify-between" href="#">
<div class="flex items-center">
<span class="material-symbols-outlined text-primary w-6 h-6 mr-3 flex items-center justify-center">format_list_bulleted</span>
<span class="text-[16px] leading-[1.5] text-on-surface">Go to list of topics</span>
</div>
<kbd class="px-2 py-0.5 text-xs text-on-surface-variant bg-surface border border-outline-variant rounded">Y</kbd>
</a>
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface" href="#">
<span class="material-symbols-outlined text-primary w-6 h-6 mr-3 flex items-center justify-center">link</span>
<span class="text-[16px] leading-[1.5] text-on-surface">Copy link to channel</span>
</a>
</div>
<!-- END: Settings Links - Group 1 -->
<!-- BEGIN: Settings Links - Group 2 -->
<div class="py-1 border-b border-surface-container-high" data-purpose="settings-links-2">
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface" href="#">
<span class="material-symbols-outlined text-primary w-6 h-6 mr-3 flex items-center justify-center">settings</span>
<span class="text-[16px] leading-[1.5] text-on-surface">Channel settings</span>
</a>
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface" href="#">
<span class="material-symbols-outlined text-primary w-6 h-6 mr-3 flex items-center justify-center">push_pin</span>
<span class="text-[16px] leading-[1.5] text-on-surface">Pin channel to top</span>
</a>
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface" href="#">
<span class="material-symbols-outlined text-primary w-6 h-6 mr-3 flex items-center justify-center">notifications_off</span>
<span class="text-[16px] leading-[1.5] text-on-surface">Mute channel</span>
</a>
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface" href="#">
<span class="material-symbols-outlined text-primary w-6 h-6 mr-3 flex items-center justify-center">cancel</span>
<span class="text-[16px] leading-[1.5] text-on-surface">Unsubscribe</span>
</a>
</div>
<!-- END: Settings Links - Group 2 -->
<!-- BEGIN: Action Links -->
<div class="py-1" data-purpose="action-links">
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface" href="#">
<span class="material-symbols-outlined text-primary w-6 h-6 mr-3 flex items-center justify-center">colorize</span>
<span class="text-[16px] leading-[1.5] text-on-surface">Change color</span>
</a>
</div>
<!-- END: Action Links -->
</div>
<!-- END: Dropdown Container -->
</body></html>
