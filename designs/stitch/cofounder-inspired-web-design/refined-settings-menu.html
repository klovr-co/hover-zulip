<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Settings Dropdown</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Hanken Grotesk"', 'sans-serif'],
          },
          colors: {
            surface: '#faf8ff',
            'surface-dim': '#d2d9f4',
            'surface-bright': '#faf8ff',
            'surface-container-lowest': '#ffffff',
            'surface-container-low': '#f2f3ff',
            'surface-container': '#eceeff',
            'surface-container-high': '#e4e7ff',
            'surface-container-highest': '#dde2ff',
            primary: '#3e58c9',
            'on-primary': '#ffffff',
            'primary-container': '#dee0ff',
            'on-primary-container': '#00115a',
            secondary: '#5a5d72',
            'on-secondary': '#ffffff',
            'secondary-container': '#dfe1f9',
            'on-secondary-container': '#171a2c',
            tertiary: '#76546f',
            'on-tertiary': '#ffffff',
            'tertiary-container': '#ffd7f5',
            'on-tertiary-container': '#2d1229',
            error: '#ba1a1a',
            'on-error': '#ffffff',
            'error-container': '#ffdad6',
            'on-error-container': '#410002',
            outline: '#767680',
            'outline-variant': '#c6c6d0',
            'on-surface': '#1b1b21',
            'on-surface-variant': '#45464f',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-utilities">
    body {
      background-color: theme('colors.surface-container');
      color: theme('colors.on-surface');
    }
    .shadow-dropdown {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body class="p-8 flex justify-center items-start min-h-screen font-sans">
<!-- BEGIN: Dropdown Container -->
<div class="relative w-72 bg-surface-container-lowest rounded-xl shadow-dropdown border border-outline-variant overflow-hidden" data-purpose="settings-dropdown">
<!-- Top Pointer Arrow (Simulated) -->
<div class="absolute -top-2 left-[4.5rem] w-4 h-4 bg-surface-container-lowest border-t border-l border-outline-variant transform rotate-45" style="clip-path: polygon(0 0, 100% 0, 0 100%);"></div>
<!-- BEGIN: Header Info -->
<div class="p-4 border-b border-surface-container-highest" data-purpose="dropdown-header">
<h2 class="text-xl font-bold text-on-surface mb-0.5">Zulip Dev</h2>
<p class="text-sm text-on-surface-variant mb-2">localhost</p>
<a class="text-primary hover:underline text-sm font-medium leading-tight inline-block" href="#">Zulip Server dev environment</a>
</div>
<!-- END: Header Info -->
<!-- BEGIN: Settings Links -->
<div class="py-2 border-b border-surface-container-highest" data-purpose="settings-links">
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface" href="#">
<svg class="w-5 h-5 mr-3 text-secondary group-hover:text-primary transition-colors" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
        Channel settings
      </a>
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface" href="#">
<svg class="w-5 h-5 mr-3 text-secondary group-hover:text-primary transition-colors" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
        Organization settings
      </a>
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface" href="#">
<svg class="w-5 h-5 mr-3 text-secondary group-hover:text-primary transition-colors" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
        Group settings
      </a>
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface" href="#">
<svg class="w-5 h-5 mr-3 text-secondary group-hover:text-primary transition-colors" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
        Personal settings
      </a>
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface" href="#">
<svg class="w-5 h-5 mr-3 text-secondary group-hover:text-primary transition-colors" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
        Usage statistics
      </a>
</div>
<!-- END: Settings Links -->
<!-- BEGIN: App & Help Links -->
<div class="py-2 border-b border-surface-container-highest" data-purpose="app-help-links">
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface" href="#">
<svg class="w-5 h-5 mr-3 text-secondary group-hover:text-primary transition-colors" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
        Desktop &amp; mobile apps
      </a>
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface" href="#">
<svg class="w-5 h-5 mr-3 text-secondary group-hover:text-primary transition-colors" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
        Integrations
      </a>
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface" href="#">
<svg class="w-5 h-5 mr-3 text-secondary group-hover:text-primary transition-colors" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
        API documentation
      </a>
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface" href="#">
<svg class="w-5 h-5 mr-3 text-secondary group-hover:text-primary transition-colors" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
        Support Zulip
      </a>
</div>
<!-- END: App & Help Links -->
<!-- BEGIN: Action Links -->
<div class="py-2" data-purpose="action-links">
<a class="flex items-center px-4 py-2 hover:bg-surface-container-low transition-colors group text-on-surface" href="#">
<svg class="w-5 h-5 mr-3 text-secondary group-hover:text-primary transition-colors" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
        Invite users
      </a>
</div>
<!-- END: Action Links -->
</div>
<!-- END: Dropdown Container -->
</body></html>
