<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Topic Menu Dropdown</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
          },
          colors: {
            primary: '#2563eb',
            surface: '#faf8ff',
            'surface-dim': '#d2d9f4',
            'surface-bright': '#faf8ff',
            'surface-container-lowest': '#ffffff',
            'surface-container-low': '#f2f3ff',
            'surface-container': '#ebeeff',
            'surface-container-high': '#e3e8ff',
            'surface-container-highest': '#dbe2ff',
            'on-surface': '#181b25',
            'on-surface-variant': '#434653',
            outline: '#747785',
            'outline-variant': '#c3c6d5',
          },
          borderRadius: {
            'xl': '0.5rem', // ROUND_EIGHT
          }
        }
      }
    }
  </script>
<style data-purpose="custom-utilities">
    .menu-item-hover:hover {
      background-color: theme('colors.surface-container-high');
    }

    /* Triangle pointing left */
    .dropdown-arrow {
      position: absolute;
      top: 40px;
      left: -6px;
      width: 12px;
      height: 12px;
      background-color: theme('colors.surface-container-lowest');
      transform: rotate(-45deg);
      border-top: 1px solid theme('colors.outline-variant');
      border-left: 1px solid theme('colors.outline-variant');
    }
  </style>
</head>
<body class="bg-surface-container-highest min-h-screen flex items-start justify-center pt-20 font-sans text-on-surface">
<!-- BEGIN: NavigationBar -->
<nav class="absolute top-0 left-0 right-0 h-16 bg-surface-container-lowest border-b border-outline-variant flex items-center justify-end px-6 space-x-2">
<!-- Help Button (Active) -->
<button class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-high text-primary hover:bg-surface-container-highest transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Settings Button -->
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 011.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.56.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.893.149c-.425.07-.765.383-.93.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 01-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.397.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 01-.12-1.45l.527-.737c.25-.35.273-.806.108-1.204-.165-.397-.505-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.107-1.204l-.527-.738a1.125 1.125 0 01.12-1.45l.773-.773a1.125 1.125 0 011.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Profile Avatar -->
<button class="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden ml-2 flex items-center justify-center">
<svg fill="none" height="24" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#747785"></path>
<path d="M2 17L12 22L22 17" stroke="#747785" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2 12L12 17L22 12" stroke="#747785" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</nav>
<!-- END: NavigationBar -->
<!-- BEGIN: DropdownMenu -->
<div class="relative mt-2 z-10 w-[340px]">
<!-- Dropdown Container -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-lg py-1 relative">
<!-- Arrow pointing to trigger -->
<div class="dropdown-arrow"></div>
<!-- Header -->
<div class="px-4 py-3">
<h3 class="font-bold text-[17px] leading-tight text-on-surface">old MOBILE is de-duping slowly</h3>
</div>
<!-- Segmented Control -->
<div class="px-4 pb-3">
<div class="flex rounded-md border border-outline-variant bg-surface overflow-hidden h-9">
<button class="flex-1 flex items-center justify-center hover:bg-surface-container-high transition-colors text-primary border-r border-outline-variant">
<svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0M3.124 7.234l3.153-2.88m14.604 2.88l-3.153-2.88M3 3l18 18" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
<button class="flex-1 flex items-center justify-center bg-surface-container-lowest hover:bg-surface-container-high transition-colors text-primary border-r border-outline-variant shadow-sm">
<svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
<button class="flex-1 flex items-center justify-center hover:bg-surface-container-high transition-colors text-primary">
<svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12.75 19.5v-.75a7.5 7.5 0 00-7.5-7.5H4.5m0-6.75h.75c7.87 0 14.25 6.38 14.25 14.25v.75M6 18.75a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>
</div>
<div class="border-t border-outline-variant"></div>
<!-- Menu Items Part 1 -->
<nav class="flex flex-col text-sm py-1.5">
<a class="flex items-center px-4 py-2 menu-item-hover text-on-surface transition-colors gap-3" href="#">
<svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M14.25 4.5l5.25 5.25m-11.25 9l-4.5.75.75-4.5 11.25-11.25a2.121 2.121 0 013 3l-11.25 11.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[16px]">Summarize recent messages</span>
</a>
<a class="flex items-center px-4 py-2 menu-item-hover text-on-surface transition-colors gap-3" href="#">
<svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[16px]">Mark all messages as unread</span>
</a>
<a class="flex items-center px-4 py-2 menu-item-hover text-on-surface transition-colors gap-3" href="#">
<svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[16px]">Copy link to topic</span>
</a>
</nav>
<div class="border-t border-outline-variant"></div>
<!-- Menu Items Part 2 -->
<nav class="flex flex-col text-sm py-1.5">
<a class="flex items-center px-4 py-2 menu-item-hover text-on-surface transition-colors gap-3" href="#">
<svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[16px]">Move topic</span>
</a>
<a class="flex items-center px-4 py-2 menu-item-hover text-on-surface transition-colors gap-3" href="#">
<svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[16px]">Mark as resolved</span>
</a>
<a class="flex items-center px-4 py-2 menu-item-hover text-on-surface transition-colors gap-3" href="#">
<svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[16px]">Delete topic</span>
</a>
</nav>
</div>
</div>
<!-- END: DropdownMenu -->
</body></html>
